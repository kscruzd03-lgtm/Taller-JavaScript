<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Sistema de Notas</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="card">
        <!-- Stickers decorativos estilo Paper Cutout -->
        <div class="tape-sticker"></div>
        <div class="clip-sticker">📎</div>

        <!-- Botón para regresar al menú principal -->
        <a href="../index.html" class="btn-volver">← VOLVER AL MENÚ</a>

        <h2>Calculadora de Definitiva</h2>

        <form>
            <label for="estudiante">Estudiante:</label>
            <input type="text" id="estudiante" placeholder="Nombre completo">
            
            <label for="n1">Nota 1 (0.0 - 5.0):</label>
            <input type="number" id="n1" step="0.1" min="0" max="5" placeholder="Ej: 4.2">
            
            <label for="n2">Nota 2 (0.0 - 5.0):</label>
            <input type="number" id="n2" step="0.1" min="0" max="5" placeholder="Ej: 3.5">
            
            <label for="n3">Nota 3 (0.0 - 5.0):</label>
            <input type="number" id="n3" step="0.1" min="0" max="5" placeholder="Ej: 2.8">
            
            <button type="button" id="btnNotas">Calcular nota</button>
        </form>

        <div id="resultadoNota" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
