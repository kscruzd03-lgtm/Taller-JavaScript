<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Sistema de Notas</title>
</head>
<body>
    <div class="card">
        <h2>Calculadora de Definitiva</h2>
        <form>
            <label>Estudiante:</label>
            <input type="text" id="estudiante" placeholder="Nombre completo">
            
            <label>Nota 1 (0.0 - 5.0):</label>
            <input type="number" id="n1" step="0.1" min="0" max="5">
            
            <label>Nota 2 (0.0 - 5.0):</label>
            <input type="number" id="n2" step="0.1" min="0" max="5">
            
            <label>Nota 3 (0.0 - 5.0):</label>
            <input type="number" id="n3" step="0.1" min="0" max="5">
            
            <button type="button" id="btnNotas">Calcular nota</button>
        </form>
        <div id="resultadoNota" class="resultado"></div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
