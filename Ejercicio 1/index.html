<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Formulario de registro</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div class="card">
        <!-- Stickers decorativos estilo Paper Cutout -->
        <div class="tape-sticker"></div>
        <div class="cross-sticker">✖</div>

        <!-- Botón para regresar al menú principal -->
        <a href="../index.html" class="btn-volver">← VOLVER AL MENÚ</a>

        <h2>Registro de usuario</h2>

        <form id="formRegistro">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" placeholder="Por favor, ingrese su nombre completo" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" placeholder="Por favor, ingrese su edad" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="Por favor, ingrese su correo electrónico" required>

            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" placeholder="Por favor, ingrese su ciudad de residencia" required>

            <button type="button" id="btnRegistrarse">Registrarse</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
