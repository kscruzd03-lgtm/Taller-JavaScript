<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Calculadora de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Calculadora de Compra</h2>
        <form id="formCompra">
            <label>Producto:</label>
            <input type="text" id="producto" placeholder="Ej: Hamburguesa">
            
            <label>Precio ($):</label>
            <input type="number" id="precio" placeholder="Ej: 15000">
            
            <label>Cantidad:</label>
            <input type="number" id="cantidad" placeholder="Ej: 3">
            
            <label>Descuento (% opcional):</label>
            <input type="number" id="descuento" value="0">
            
            <button type="button" id="btnCalcular">Calcular</button>
        </form>
        <div id="resumen" class="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
